# Fly.io configuration for SpendSense (worker — no HTTP service)
app = "spendsense-bot"
primary_region = "sin"  # Singapore, closest to Jakarta

[build]

[env]
  DATABASE_PATH        = "/data/spendsense.db"
  TIMEZONE             = "Asia/Jakarta"
  POLL_INTERVAL_SECONDS = "60"
  WEEKLY_SUMMARY_DAY   = "mon"
  WEEKLY_SUMMARY_HOUR  = "18"
  WEEKLY_SUMMARY_MINUTE = "0"

# Persistent volume for SQLite. Create once with:
#   fly volumes create spendsense_data --region sin --size 1
[[mounts]]
  source      = "spendsense_data"
  destination = "/data"
